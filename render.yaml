services:
  - type: web
    name: fireflies-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:push && npm run db:seed && HOSTNAME=0.0.0.0 npm run start
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        value: file:/tmp/fireflies.db
