services:
  - type: web
    name: fireflies-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:push && npm run db:seed && npm run start
    healthCheckPath: /api/stats
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:/tmp/fireflies.db
